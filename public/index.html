<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儿童英语学习平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .alert {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .word-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            transition: all 0.3s;
        }

        .word-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .word-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .word-card p {
            color: #666;
            margin: 5px 0;
        }

        .quiz-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .quiz-option {
            border: 3px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            background: white;
        }

        .quiz-option:hover {
            border-color: #667eea;
            transform: scale(1.05);
        }

        .quiz-option.selected {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .quiz-option.correct {
            border-color: #28a745;
            background: #d4edda;
        }

        .quiz-option.incorrect {
            border-color: #dc3545;
            background: #f8d7da;
        }

        .quiz-option img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-card h4 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .nav-buttons .btn {
            flex: 1;
        }

        .user-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-info strong {
            color: #667eea;
        }

        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #c82333;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .quiz-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 儿童英语学习平台</h1>
        <p class="subtitle">让学习英语变得简单有趣</p>

        <!-- 登录/注册页面 -->
        <div id="authPage" class="page active">
            <div id="authAlert"></div>
            
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名">
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码（至少6位）">
            </div>

            <button class="btn btn-primary" onclick="login()">登录</button>
            <button class="btn btn-secondary" onclick="register()">注册新账号</button>
        </div>

        <!-- 主页面 -->
        <div id="mainPage" class="page">
            <div class="user-info">
                <div>
                    <strong>欢迎，<span id="currentUser"></span>！</strong>
                </div>
                <button class="logout-btn" onclick="logout()">退出登录</button>
            </div>

            <div id="mainAlert"></div>

            <div class="stats">
                <div class="stat-card">
                    <h4 id="totalWords">0</h4>
                    <p>学习单词</p>
                </div>
                <div class="stat-card">
                    <h4 id="dueReviews">0</h4>
                    <p>待复习</p>
                </div>
                <div class="stat-card">
                    <h4 id="completedReviews">0</h4>
                    <p>已完成</p>
                </div>
            </div>

            <div class="nav-buttons">
                <button class="btn btn-primary" onclick="showLearnPage()">📚 学习新单词</button>
                <button class="btn btn-primary" onclick="showReviewPage()">🔄 开始复习</button>
                <button class="btn btn-primary" onclick="showQuizPage()">✏️ 测验练习</button>
            </div>
        </div>

        <!-- 学习页面 -->
        <div id="learnPage" class="page">
            <div id="learnAlert"></div>

            <div class="form-group">
                <label for="wordInput">输入英文单词</label>
                <input type="text" id="wordInput" placeholder="例如：apple">
            </div>

            <button class="btn btn-primary" onclick="translateWord()">🔍 翻译并获取图片</button>

            <div id="translationResult" style="margin-top: 20px;"></div>

            <div class="nav-buttons">
                <button class="btn btn-secondary" onclick="showMainPage()">返回主页</button>
            </div>
        </div>

        <!-- 复习页面 -->
        <div id="reviewPage" class="page">
            <div id="reviewAlert"></div>
            <div id="reviewContent"></div>

            <div class="nav-buttons">
                <button class="btn btn-secondary" onclick="showMainPage()">返回主页</button>
            </div>
        </div>

        <!-- 测验页面 -->
        <div id="quizPage" class="page">
            <div id="quizAlert"></div>
            <div id="quizContent"></div>

            <div class="nav-buttons">
                <button class="btn btn-secondary" onclick="showMainPage()">返回主页</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
